# Analisis estatico de Zenith Optimizer.
#
# Vive en el repositorio y no solo en el panel de SonarCloud: asi la exclusion
# de la demo y el mapeo de cobertura se revisan con un pull request, igual que
# el codigo.

sonar.projectKey=Cooounterfeit_Optimizador_RPG
sonar.organization=cooounterfeit
sonar.projectName=Optimizador_RPG

sonar.sourceEncoding=UTF-8

# `demo/` queda fuera. Es el prototipo archivado (PR #2) y duplica el motor de
# libs/core-engine: incluirlo inflaba la duplicacion de `libs` al 37 % y
# atribuia al producto 24 de los 35 bugs del tablero.
sonar.sources=apps,libs,supabase,tools,.github,Dockerfile
sonar.tests=apps,libs,supabase
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx

sonar.exclusions=\
  demo/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/out-tsc/**,\
  **/test-output/**,\
  **/coverage/**,\
  **/*.d.ts,\
  **/vite-env.d.ts,\
  **/*.config.mts,\
  **/*.config.ts,\
  **/*.timestamp-*

# `esquema_completo.sql` es una copia GENERADA de supabase/migrations (se pega
# entera en un proyecto nuevo). No es codigo que nadie escriba dos veces: al
# contarlo como codigo nuevo, sus 1176 lineas se solapaban con las migraciones
# que copia y el PR marcaba 14,3 % de duplicacion sobre 0 % real. Se excluye del
# detector de copias, no del repositorio: sigue versionado y se regenera.
sonar.cpd.exclusions=supabase/esquema_completo.sql

# Los tipos generados desde Supabase no se escriben a mano: incluirlos en la
# cobertura solo hunde el porcentaje sin medir nada.
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.config.*,\
  **/*.d.ts,\
  apps/web/src/lib/database.types.ts,\
  libs/shared-types/src/lib/database.types.ts,\
  tools/**

# Un solo reporte para todos los proyectos: `tools/merge-coverage.mjs` combina
# los lcov de cada uno con las rutas relativas a la raiz del repositorio.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
