name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'
  CI: 'true'
  # `nx affected` compara contra una base. En un PR es la rama destino; en un
  # push a main, el commit anterior.
  NX_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}

jobs:
  quality:
    name: Build, lint, typecheck y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Guardia de géneros
        run: npm run check:genres

      - name: Caché de Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # Solo se valida lo que cambió. En push a main la base es HEAD~1, así que
      # un merge entrante valida todo lo que trae.
      - name: Lint, pruebas, tipos y build
        run: npx nx affected -t lint test typecheck build --base=$NX_BASE

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Solo dependencias de producción: las de desarrollo no llegan al bundle
      # que se sirve, y auditarlas genera ruido que nadie acciona.
      - name: npm audit (producción)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Caché de Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas de punta a punta
        run: npx nx e2e web-e2e -- --project=chromium

      # Sin esto, un fallo de e2e en CI es indepurable: no queda video, ni
      # screenshot, ni trace descargable.
      - name: Subir reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web-e2e/playwright-report
            apps/web-e2e/test-results
          retention-days: 7

  sonar:
    name: Análisis SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # El analisis necesita el historial completo para atribuir lineas
          # nuevas y cambios (blame) al autor correcto.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Cobertura sobre TODOS los proyectos, no solo los afectados: Sonar
      # compara contra la rama destino y un reporte parcial marcaria como no
      # cubierto lo que simplemente no se ejecuto.
      # --skip-nx-cache porque una tarea cacheada no vuelve a escribir el lcov.
      - name: Pruebas con cobertura
        run: npx nx run-many -t test --coverage --skip-nx-cache

      - name: Combinar reportes lcov
        run: node tools/merge-coverage.mjs

      - name: Analizar con SonarQube
        uses: SonarSource/sonarqube-scan-action@v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
