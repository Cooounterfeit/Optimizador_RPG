name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'
  CI: 'true'
  # `nx affected` compara contra una base. En un PR es la rama destino; en un
  # push a main, el commit anterior.
  NX_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}

jobs:
  quality:
    name: Build, lint, typecheck y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Guardia de géneros
        run: npm run check:genres

      - name: Caché de Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # Solo se valida lo que cambió. En push a main la base es HEAD~1, así que
      # un merge entrante valida todo lo que trae.
      - name: Lint, pruebas, tipos y build
        run: npx nx affected -t lint test typecheck build --base=$NX_BASE

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Solo dependencias de producción: las de desarrollo no llegan al bundle
      # que se sirve, y auditarlas genera ruido que nadie acciona.
      - name: npm audit (producción)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Caché de Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas de punta a punta
        run: npx nx e2e web-e2e -- --project=chromium

      # Sin esto, un fallo de e2e en CI es indepurable: no queda video, ni
      # screenshot, ni trace descargable.
      - name: Subir reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web-e2e/playwright-report
            apps/web-e2e/test-results
          retention-days: 7

  sonar:
    name: Análisis SonarQube
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # El analisis necesita el historial completo para atribuir lineas
          # nuevas y cambios (blame) al autor correcto.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      # Cobertura sobre TODOS los proyectos, no solo los afectados: Sonar
      # compara contra la rama destino y un reporte parcial marcaria como no
      # cubierto lo que simplemente no se ejecuto.
      # Sin --skip-nx-cache a proposito: el target `test` declara
      # `test-output/vitest/coverage` como output, asi que un cache hit
      # restaura el lcov igual que lo haria la ejecucion. El flag no cambia
      # nada hoy (el job no tiene caché), y no hace falta si se agrega.
      # --no-install: nx ya viene en el lockfile, no se descarga nada al vuelo.
      - name: Pruebas con cobertura
        run: npx --no-install nx run-many -t test --coverage

      - name: Combinar reportes lcov
        run: node tools/merge-coverage.mjs

      # Fijado por SHA y no por tag: un tag puede moverse a otro commit.
      # Sin token el escaneo falla; se omite en lugar de dejar main en rojo,
      # avisando en el log para que no pase inadvertido.
      - name: Analizar con SonarQube
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: Avisar que falta el token
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "::warning::SONAR_TOKEN no esta configurado; el analisis de Sonar se omitio."
          echo "Agregalo en Settings > Secrets and variables > Actions."
          echo "Y desactiva el analisis automatico en SonarCloud > Administration > Analysis Method."
