server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La app es una SPA: cualquier ruta desconocida vuelve al index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets de Vite llevan hash en el nombre: se pueden cachear de por vida.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El index no se cachea: es lo que referencia los assets con hash nuevo.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;

    # Los seeds son JSON versionados junto al bundle.
    location /seeds/ {
        add_header Cache-Control "public, max-age=3600";
    }
}
